# Empêche la mise en veille du projet Supabase et vérifie que le site répond.
# Le plan gratuit met en pause les projets dont l'activité est « trop faible sur 7 jours » :
# d'après la documentation, il faut quelques requêtes par jour. Une seule requête par
# semaine n'a pas suffi (projet mis en pause le 22 novembre 2026 malgré un ping le 16).
# https://supabase.com/docs/guides/platform/free-project-pausing
name: Maintien en éveil de Supabase

on:
  schedule:
    # Deux fois par jour : GitHub retarde souvent les tâches planifiées de plusieurs heures
    # et peut en sauter une, la seconde sert de marge.
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  actions: write # pour réactiver les tâches planifiées (voir la dernière étape)
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger la base (activité Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Plusieurs lectures, sur des tables ouvertes au rôle anonyme
          echec=0
          for table in publication evenements profils_publics; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/$table?select=id&limit=1")
            echo "Réponse de Supabase ($table) : $code"
            test "$code" = "200" || echec=1
          done
          exit $echec

      - name: Vérifier que le site répond
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://cani-sport-eure-three.vercel.app/)
          echo "Réponse du site : $code"
          test "$code" = "200"

      # GitHub désactive les tâches planifiées d'un dépôt public après 60 jours sans
      # activité. Réactiver explicitement les deux tâches remet ce compteur à zéro.
      - name: Garder les tâches planifiées actives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in maintien-supabase.yml export-base.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" && echo "$wf : active"
          done
